# Builds the macOS app when a version tag is pushed, attaches the DMG to a
# GitHub release, then points the cask in Casks/ at the new release.
#
# The build runs npm packages and build scripts, so it gets a read-only token
# that isn't kept in git's config. Only the publish job can write, and it
# runs no third-party code.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Apple Silicon. The app is ad-hoc signed, not notarized.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Check the tag matches the app version
        run: |
          # The cask compares versions by sorting them, which puts 1.2.0-rc.1
          # after 1.2.0, so only stable versions are released.
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags look like v1.2.0. $GITHUB_REF_NAME isn't one, so nothing is released."
            exit 1
          fi
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the app version $version in tauri.conf.json."
            exit 1
          fi

      - name: Install the frontend's packages
        working-directory: app
        run: npm ci

      - name: Build the DMG
        working-directory: app
        run: npm run tauri build -- --bundles dmg

      - name: Name the DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # GitHub turns spaces in asset names into dots, so give it a fixed name.
          mkdir dist
          cp "target/release/bundle/dmg/Morphagene Reels_${version}_aarch64.dmg" \
            "dist/Morphagene-Reels-$version-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One cask update at a time, so two releases can't race on main. Every
    # waiting release keeps its place instead of the newest cancelling it.
    concurrency:
      group: cask-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dmg="Morphagene-Reels-${GITHUB_REF_NAME#v}-arm64.dmg"
          # Safe to rerun: an existing release is reused, and a DMG already
          # attached to it is kept, so the cask gets the sha256 of the file
          # people download.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qxF "$dmg"; then
            mkdir published
            gh release download "$GITHUB_REF_NAME" --pattern "$dmg" --dir published
            file="published/$dmg"
          else
            gh release upload "$GITHUB_REF_NAME" "dist/$dmg"
            file="dist/$dmg"
          fi
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: main
          path: repo

      - name: Point the cask at the release
        working-directory: repo
        env:
          SHA256: ${{ steps.publish.outputs.sha256 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cask=Casks/morphagene-reels.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            current=$(sed -nE 's/^  version "(.*)"$/\1/p' "$cask")
            # Only move forward: a late older release mustn't replace a newer one.
            newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
            if [ "$newest" != "$version" ]; then
              echo "The cask is at $current, newer than $version. Leaving it."
              exit 0
            fi
            sed -i -E \
              -e "s/^  version \".*\"$/  version \"$version\"/" \
              -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" \
              "$cask"
            if git diff --quiet; then
              echo "The cask already points at $version."
              exit 0
            fi
            git commit -qam "Point the cask at $GITHUB_REF_NAME"
            if git push origin HEAD:main; then
              exit 0
            fi
            # Someone pushed to main meanwhile: start again from the new main.
            git fetch origin main
            git reset -q --hard origin/main
          done
          echo "Couldn't push the cask update to main."
          exit 1
