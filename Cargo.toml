[workspace]
members = ["crates/mgreel-core", "crates/mgreel-cli", "app/src-tauri"]
# The app needs a built frontend (app/build), so plain `cargo build` at
# the root skips it. Build it with `cargo tauri build` in app/.
default-members = ["crates/mgreel-core", "crates/mgreel-cli"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["rlhatcher <ronaldhatcher@mac.com>"]
license = "ISC"
repository = "https://github.com/rlhatcher/mgreel-rs"

[workspace.dependencies]
anyhow = "1.0"
hound = "3.5"
rubato = "0.15"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
mgreel-core = { path = "crates/mgreel-core" }

# From the Tauri template: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
