[package]
name = "mgreel-app"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Manage Make Noise Morphagene reels, splices and options.txt"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# Cargo needs on Windows (rust-lang/cargo#8519).
name = "mgreel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
anyhow.workspace = true
mgreel-core.workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
